name: Build Califnco Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold & Prepare Android Scaffolding
        working-directory: ./mobile_app
        run: |
          flutter create . --org com.califnco --project-name califnco_water
          flutter pub get

      - name: Build Android APK Release
        working-directory: ./mobile_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: califnco-water-purifier-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
